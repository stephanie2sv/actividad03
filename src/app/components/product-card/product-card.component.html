<div class="card mb-3">
    <div class="row g-0">
        <div class="col-md-4">
            <img [src]="prod.image" [alt]="prod.name" class="img-fluid rounded-start">
        </div>

        <div class="col-md-8">
            <div class="card-body">
                <h5 class="card-title">{{prod.name}}</h5>
                <p class="card-text">{{prod.description}}</p>
                <p class="card-text"><small class="text-body-secondary">{{prod.price}}</small></p>
            </div>
        </div>
        <button class="btn btn-danger mt-3" (click)="deleteProducto(prod)">Eliminar</button>
    </div>
</div>
